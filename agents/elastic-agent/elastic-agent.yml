# elastic-agent-mrx.yml
# Minimal standalone Elastic Agent configuration for Murex mxres log ingestion.
#
# Scope: /Murex/IFC_TEST/logs/*.mxres.log only.
# For the full multi-input configuration see filebeat-mrx.yml.
#
# Standalone mode is active when no 'fleet:' block is present.

outputs:
  default:
    type: logstash
    hosts:
      - "logstash:5050"



# all inputs are in single yml cofig file under inputs.d directory

agent:
  monitoring:
    enabled: false
    logs: false
    metrics: false


# agent.logging.level: debug
agent.logging.to_files: true
agent.logging.files:
  path: logs
  name: elastic-agent
  keepfiles: 7
  permissions: 0600


agent.logging.event_data.to_files: true
agent.logging.event_data.path: logs/events
agent.logging.event_data.files.name: elastic-agent-event-data

agent.logging.metrics.enabled: false
agent.logging.metrics.period: 600s

