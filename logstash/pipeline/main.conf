input {
  beats {
    port => 5050
  }
}

# Drop events with an unrecognised fields.type early so they never reach the
# output stage. Add new known types here as sub-pipelines are introduced.
filter {
  if [fields][type] not in ["app_config", "app_db_config", "app_config_change", "app_log", "elk_infra_log"] {
    drop {}
  }
}

# Pure dispatcher — route by fields.type to the appropriate sub-pipeline.
# To add a new event type: add it to the allowlist above, add a branch below,
# and register the pipeline in pipelines.yml.
output {
  if [fields][type] == "app_config" or [fields][type] == "app_db_config" {
    pipeline { send_to => ["app_config_pipeline"] }
  } else if [fields][type] == "app_config_change" {
    pipeline { send_to => ["app_config_audit_pipeline"] }
  } else if [fields][type] == "app_log" {
    pipeline { send_to => ["app_logs_pipeline"] }
  } else if [fields][type] == "elk_infra_log" {
    pipeline { send_to => ["elk_infra_pipeline"] }
  }
}