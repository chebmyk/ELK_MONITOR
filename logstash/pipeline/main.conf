input {
  beats {
    port => 5050
  }
}

# ── Category router ──────────────────────────────────────────────────────────
# main.conf only knows about CATEGORIES. Each category has its own dispatcher
# in pipeline/<category>/_dispatch.conf which routes to the actual leaf pipeline.
#
# To add a new category:
#   1. Create pipeline/<category>/_dispatch.conf with input { pipeline { address => "<cat>_in" } }
#   2. Register the dispatcher + leaf pipelines in pipelines.yml.
#   3. Add ONE branch below.
#
# Adding a new event TYPE inside an existing category does NOT require editing
# this file — only the category's _dispatch.conf.

filter {
  ruby {
    code => '
      t    = event.get("[fields][type]") || "(not set)"
      host = event.get("[host][name]")   || "unknown"
      logger.debug("[main] IN  fields.type=#{t} host=#{host}")
    '
  }
}

output {
  if [fields][type] =~ /^app_/ or [fields][type] == "heartbeat" {
    pipeline { send_to => ["app_in"] }
  } else if [fields][type] =~ /^elk_/ {
    pipeline { send_to => ["elk_in"] }
  } else if [fields][type] =~ /^mrx_/ {
    pipeline { send_to => ["mrx_in"] }
  } else {
    # Unrecognised — log and drop.
    stdout {
      codec => line {
        format => "[main] DROP unknown fields.type=%{[fields][type]} host=%{[host][name]}"
      }
    }
  }
}