input {
  beats {
    port => 5050
  }
}

filter {

  # ── Heartbeat ────────────────────────────────────────────────────────────────
  if [fields][type] == "heartbeat" {
    json {
      source => "message"
      target => "[hb]"
    }
    mutate {
      rename => {
        "[hb][service]"     => "service_name"
        "[hb][environment]" => "environment"
        "[hb][status]"      => "status"
        "[hb][optional]"    => "optional"
      }
      remove_field => ["hb", "message"]
    }

  # ── App Config ────────────────────────────────────────────────────────────
  } else if [fields][type] == "app_config" {
    xml {
      source => "message"
      store_xml => false
      force_array => false
      remove_namespaces => true
      xpath => [
        "/app/name/text()",        "app_name",
        "/app/version/text()",     "app_version",
        "/app/environment/text()", "app_environment",
        "/app/appfolder/text()",   "app_appfolder"
      ]
    }
    mutate {
      add_field => { "config_type" => "app_config" }
      rename => {
        "app_name"        => "[config][app][name]"
        "app_version"     => "[config][app][version]"
        "app_environment" => "[config][app][environment]"
        "app_appfolder"   => "[config][app][appfolder]"
      }
    }
    ruby {
      code => "event.set('[config][app][config_last_modified]', event.get('@timestamp').to_s)"
    }

  # ── DB datasource XML config ──────────────────────────────────────────────────
  } else if [fields][type] == "app_db_config" {
    xml {
      source => "message"
      store_xml => false
      force_array => false
      remove_namespaces => true
      xpath => [
        "/datasources/datasource/name/text()",      "datasource_name",
        "/datasources/datasource/url/text()",       "db_url",
        "/datasources/datasource/pool_size/text()", "db_pool_size"
      ]
    }
    mutate {
      add_field => { "config_type" => "datasource_config" }
      rename => {
        "datasource_name" => "[config][db][name]"
        "db_url"          => "[config][db][url]"
        "db_pool_size"    => "[config][db][pool_size]"
      }
    }
    ruby {
      code => "event.set('[config][db][config_last_modified]', event.get('@timestamp').to_s)"
    }

  # ── Bulk config monitor ───────────────────────────────────────────────────────
  # Tracks any XML file matched by the bulk_config Filebeat input.
  # Normalizes XML → JSON before hashing so whitespace/formatting changes are ignored.
  # NOTE: XML attributes are stored as @attr_name keys. Repeated sibling elements
  # are stored as arrays only when more than one sibling shares the same tag — this
  # means a field may be an object in one document and an array in another if the
  # file structure changes. Define an explicit ES mapping for known repeated tags
  # to avoid mapping conflicts.
  } else if [fields][type] == "config_monitor" {
    ruby {
      code => '
        require "rexml/document"
        require "json"
        require "digest"

        def xml_to_hash(el)
          result = {}

          el.attributes.each { |name, val| result["@#{name}"] = val }

          if el.elements.empty?
            text = el.text&.strip
            return result.empty? ? text : result.merge("#text" => text)
          end

          counts = Hash.new(0)
          el.elements.each { |child| counts[child.name] += 1 }

          el.elements.each do |child|
            value = xml_to_hash(child)
            if counts[child.name] > 1
              result[child.name] ||= []
              result[child.name] << value
            else
              result[child.name] = value
            end
          end

          result
        end

        begin
          doc  = REXML::Document.new(event.get("message"))
          hash = xml_to_hash(doc.root)
          canonical = JSON.generate(hash)

          file_path = event.get("[log][file][path]").to_s
          file_name = file_path.split("/").last

          event.set("content",      hash)
          event.set("content_hash", Digest::SHA1.hexdigest(canonical))
          event.set("config_file",  file_name)
          event.set("config_path",  file_path)
          event.set("last_changed", event.get("@timestamp").to_s)
        rescue => e
          event.set("parse_error", e.message)
        end
      '
      remove_field => ["message"]
    }

  # ── App logs → forwarded to logs_pipeline via pipeline-to-pipeline ────────────
  } else if [fields][type] == "app_log" {
    # no additional filter here; log.conf handles enrichment

  } else {
    drop {}
  }
}

output {

  # ── Heartbeat → current state (upsert, one doc per environment+service) ───────
  if [fields][type] == "heartbeat" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user  => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "health-status"
      document_id => "%{environment}-%{service_name}"
      action => "update"
      doc_as_upsert => true
    }

  # ── App/DB config → dual-write: current state (upsert) + history (append) ─────
  } else if [fields][type] == "app_config" or [fields][type] == "app_db_config" {
    # Current state: partial update so [config][app] and [config][db] never overwrite each other
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user  => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "app-main-config-current"
      document_id => "%{[host][name]}"
      action => "update"
      doc_as_upsert => true
      retry_on_conflict => 3
    }
    # History: new doc on every change (Filebeat only re-ships when file mtime changes)
    # elasticsearch {
    #   hosts => ["http://elasticsearch:9200"]
    #   index => "app-configs-history"
    #   action => "index"
    # }

  # ── Config monitor → append new doc only when content changes ────────────────
  # document_id = host+file+hash ensures identical content is never stored twice.
  # ES returns 409 on duplicate create which Logstash ignores — natural dedup.
  } else if [fields][type] == "config_monitor" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user  => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "app-config-monitor"
      document_id => "%{[host][name]}-%{config_file}-%{content_hash}"
      action => "create"
    }

  # ── App logs → hand off to logs_pipeline (pipeline-to-pipeline) ───────────────
  } else if [fields][type] == "app_log" {
    pipeline {
      send_to => ["logs_pipeline"]
    }
  }
}
