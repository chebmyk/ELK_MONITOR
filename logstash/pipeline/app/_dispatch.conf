# app category dispatcher
# ─────────────────────────
# Receives every event whose fields.type starts with `app_` (or equals
# `heartbeat`) from main.conf, and forwards to the correct leaf pipeline.
#
# To add / disable an event type in this category:
#   1. Add or comment a branch below.
#   2. Register the leaf pipeline in /usr/share/logstash/config/pipelines.yml.
# No changes to main.conf are needed.

input {
  pipeline {
    address => "app_in"
  }
}

output {
  if [fields][type] == "app_config" or [fields][type] == "app_db_config" {
    pipeline { send_to => ["app_config_pipeline"] }
  } else if [fields][type] == "app_config_change" {
    pipeline { send_to => ["app_config_audit_pipeline"] }
  } else if [fields][type] == "app_log" {
    pipeline { send_to => ["app_logs_pipeline"] }
  # } else if [fields][type] == "heartbeat" {
  #   pipeline { send_to => ["heartbeat_pipeline"] }    # disabled
  } else {
    stdout {
      codec => line {
        format => "[app] DROP unknown fields.type=%{[fields][type]} host=%{[host][name]}"
      }
    }
  }
}
