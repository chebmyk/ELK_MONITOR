input {
  # Receives app_log events forwarded from main_pipeline via pipeline-to-pipeline
  pipeline {
    address => "app_logs_pipeline"
  }
}

filter {
  if [fields][type] == "app_log" {
    mutate {
      add_field => {
        "type"     => "app_log"
        "server"   => "%{[host][name]}"
        "filename" => "%{[log][file][path]}"
      }
    }

    # Step 1: extract timestamp, logger_name, log_level, and raw message body
    grok {
      match => {
        "message" => "(?<log_timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+) - %{DATA:logger_name} - %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_app_log_base_parse_failure"]
    }

    # Step 2: split logger_name → app_name + thread  (e.g. app_mock_v1.main)
    grok {
      match => { "logger_name" => "%{DATA:app_name}\.%{GREEDYDATA:thread}" }
      tag_on_failure => []
    }

    # Step 3: promote log timestamp to @timestamp
    date {
      match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
      remove_field => ["log_timestamp"]
    }

    # Step 4: parse structured fields from the message body
    # Patterns are tried in order; first match wins.
    grok {
      match => {
        "log_message" => [
          # ── main: HTTP ─────────────────────────────────────────────────────
          "Handling request %{WORD:http_method} %{URIPATH:http_path} \[%{NUMBER:http_status_code:int} %{WORD:http_status_text}\] %{NUMBER:duration_ms:int}ms",
          "Response time elevated: %{NUMBER:duration_ms:int}ms for %{WORD:http_method} %{URIPATH:http_path}",
          "Failed to process request %{WORD:http_method} %{URIPATH:http_path}: %{GREEDYDATA:error}",
          "Database query timeout after %{NUMBER:duration_ms:int}ms",
          # ── main: session / memory / retry ────────────────────────────────
          "User session created for user_id=%{NUMBER:user_id:int}",
          "Memory usage at %{NUMBER:memory_pct:int}%, approaching threshold",
          "Retrying database connection \(attempt %{NUMBER:retry_attempt:int}/%{NUMBER:retry_max:int}\)",
          "Unhandled exception in request handler: %{GREEDYDATA:exception}",
          # ── worker: jobs / queue ───────────────────────────────────────────
          "Processing job_id=%{DATA:job_id} type=%{GREEDYDATA:job_type}",
          "Job completed successfully job_id=%{DATA:job_id} duration=%{NUMBER:duration_s:float}s",
          "Job retry attempt %{NUMBER:retry_attempt:int}/%{NUMBER:retry_max:int} for job_id=%{GREEDYDATA:job_id}",
          "Job failed job_id=%{DATA:job_id}: %{GREEDYDATA:error}",
          "Queue size growing: %{NUMBER:queue_size:int} jobs pending",
          "Queue size: %{NUMBER:queue_size:int} jobs pending",
          "Batch processed: %{NUMBER:record_count:int} records in %{NUMBER:duration_s:float}s",
          "Worker thread response slow: %{NUMBER:duration_ms:int}ms",
          # ── scheduler: tasks ───────────────────────────────────────────────
          "Task completed: %{DATA:task_name} duration=%{NUMBER:duration_s:float}s",
          "Task failed: %{DATA:task_name} error=%{GREEDYDATA:error}",
          "Task %{DATA:task_name} delayed by %{NUMBER:scheduled_delay_minutes:int} minutes",
          "Scheduled task %{DATA:task_name} skipped: %{GREEDYDATA:reason}",
          "Executing scheduled task: %{GREEDYDATA:task_name}",
          "Missed scheduled execution window for task: %{GREEDYDATA:task_name}",
          "Execution took longer than expected: %{NUMBER:duration_ms:int}ms",
          "Next run scheduled in %{NUMBER:scheduled_in_minutes:int} minutes"
        ]
      }
      tag_on_failure => ["_app_log_message_parse_failure"]
    }

    mutate {
      remove_field => ["message", "logger_name"]
    }

  } else {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTIC_SCHEME}://${ELASTIC_HOST}:${ELASTIC_PORT}"]
    user  => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    ssl_verification_mode       => "full"
    index => "app-logs-%{[host][name]}-%{+YYYY.MM.dd}"
  }
  #stdout { codec => rubydebug }
}
