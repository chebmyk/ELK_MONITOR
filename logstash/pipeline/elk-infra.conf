input {
  # Receives elk_infra_log events forwarded from main_pipeline via pipeline-to-pipeline
  pipeline {
    address => "elk_infra_pipeline"
  }
}

filter {
  if [fields][type] == "elk_infra_log" {

    # Both Elasticsearch and Logstash write one JSON object per log line.
    # Parse the raw message into an [elk_infra] sub-object for structured access.
    json {
      source              => "message"
      target              => "elk_infra"
      skip_on_invalid_json => true
    }

    # Promote the component tag set by Filebeat fields
    mutate {
      add_field => { "component" => "%{[fields][component]}" }
    }

    # ── Timestamp promotion ────────────────────────────────────────────────────
    # Elasticsearch JSON logs:  { "timestamp": "2026-05-18T..." }
    # Logstash JSON logs:       { "@timestamp": "2026-05-18T..." }  ← already @timestamp
    if [elk_infra][timestamp] {
      date {
        match        => ["[elk_infra][timestamp]", "ISO8601"]
        target       => "@timestamp"
        remove_field => ["[elk_infra][timestamp]"]
      }
    }

    mutate {
      remove_field => ["message"]
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://${ELASTIC_HOST}:${ELASTIC_PORT}"]
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    # Index pattern: logs-elk-elastic-2026.05.18 / logs-elk-logstash-2026.05.18 / logs-elk-kibana-2026.05.18
    index    => "logs-elk-%{component}-%{+YYYY.MM.dd}"
    action   => "create"
  }
}
