input {
  # Receives heartbeat events from main_pipeline via pipeline-to-pipeline
  pipeline {
    address => "heartbeat_pipeline"
  }
}

filter {
  json {
    source => "message"
    target => "[hb]"
  }
  mutate {
    rename => {
      "[hb][service]"     => "service_name"
      "[hb][environment]" => "environment"
      "[hb][status]"      => "status"
      "[hb][optional]"    => "optional"
    }
    remove_field => ["hb", "message"]
  }
}

output {
  # Upsert — one doc per environment+service keeps health-status small and current
  elasticsearch {
    hosts    => ["http://${ELASTIC_HOST}:${ELASTIC_PORT}"]
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    index    => "health-status"
    document_id   => "%{environment}-%{service_name}"
    action        => "update"
    doc_as_upsert => true
  }
}
