# dropped_events_pipeline
# Generic sink for events that failed parsing in any leaf pipeline.
# Other pipelines route unparsed events here via:
#   pipeline { send_to => "dropped_events_in" }
#
# Writes one JSON line per event to a daily-rolling file under
# /usr/share/logstash/data/dropped-events/. Mount that path from the
# host (e.g. /Data/logstash-dropped) if you want the files to survive
# container restarts.

input {
  pipeline {
    address => "dropped_events_in"
  }
}

output {
  file {
    path             => "/usr/share/logstash/data/dropped-events/dropped-%{+YYYY-MM-dd}.log"
    codec            => json_lines
    create_if_deleted => true
  }
}
