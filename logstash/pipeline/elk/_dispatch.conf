# elk category dispatcher
# ─────────────────────────
# Receives every event whose fields.type starts with `elk_` from main.conf,
# and forwards to the correct leaf pipeline.

input {
  pipeline {
    address => "elk_in"
  }
}

output {
  if [fields][type] == "elk_infra_log" {
    pipeline { send_to => ["elk_infra_pipeline"] }
  } else {
    stdout {
      codec => line {
        format => "[elk] DROP unknown fields.type=%{[fields][type]} host=%{[host][name]}"
      }
    }
  }
}
