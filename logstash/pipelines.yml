# app_pipeline: single beats input on port 5050.
# Handles heartbeats + XML configs; forwards app_log events to logs_pipeline
# via pipeline-to-pipeline (no port conflict).
- pipeline.id: app_pipeline
  path.config: "/usr/share/logstash/pipeline/app.conf"

# logs_pipeline: receives app_log events from app_pipeline internal queue.
- pipeline.id: logs_pipeline
  path.config: "/usr/share/logstash/pipeline/log.conf"
