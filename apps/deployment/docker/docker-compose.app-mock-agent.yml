# apps/deployment/docker/docker-compose.app-mock-agent.yml
#
# On-demand app_mock launcher — Elastic Agent variant.
# Managed by apps/deployment/docker/run_app_server.sh --agent — do not run directly.
#
# Required env vars (set by run_app_server.sh):
#   ENV_NAME   — unique environment name, e.g. staging / prod / uat / test01
#   APP_DIR    — absolute path to the app_config_* directory to mount as /app
#
# Run via: run_app_server.sh start <env> [config] --agent
# Build context is the apps/ directory; Dockerfile is at apps/deployment/Dockerfile.elastic-agent.

version: '3.8'

services:
  app_mock:
    build:
      context: ../..
      dockerfile: deployment/Dockerfile.elastic-agent
    image: app-mock-agent:latest
    container_name: app_mock_${ENV_NAME}
    hostname: app_mock_${ENV_NAME}
    volumes:
      - ${APP_DIR}:/app
      - ${APP_DIR}/logs:/var/log/app_mock
    networks:
      - elk-monitor
    restart: unless-stopped

networks:
  elk-monitor:
    external: true
