version: '3.8'

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${ELASTIC_PORT}:${ELASTIC_PORT}"
    volumes:
      - ${ES_DATA_DIR}:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:${ELASTIC_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    container_name: logstash
    command: >
      bash -c "
      /usr/share/logstash/bin/logstash-plugin update logstash-input-beats &&
      /usr/share/logstash/bin/logstash
      "
    environment:
      - ELASTIC_USER=logstash_writer
      - ELASTIC_PASSWORD=${LOGSTASH_PASSWORD}
      - ELASTIC_HOST=${ELASTIC_HOST}
      - ELASTIC_PORT=${ELASTIC_PORT}
    volumes:
      - ../../logstash/pipeline:/usr/share/logstash/pipeline
      - ../../logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml
      - ../../logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "${LOGSTASH_PORT}:${LOGSTASH_PORT}"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://${ELASTIC_HOST}:${ELASTIC_PORT}
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
    ports:
      - "${KIBANA_PORT}:${KIBANA_PORT}"
    volumes:
      - ../../kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    depends_on:
      elasticsearch:
        condition: service_healthy

  # kibana-setup:
  #   image: curlimages/curl:8.6.0
  #   container_name: kibana-setup
  #   volumes:
  #     - ../../kibana:/kibana
  #   entrypoint: ["/bin/sh", "/kibana/setup.sh"]
  #   depends_on:
  #     - kibana
  #   restart: "no"

# Give the default network a stable, predictable name so app_mock instances
# can join it as an external network regardless of the project directory name.
networks:
  default:
    name: elk-monitor
